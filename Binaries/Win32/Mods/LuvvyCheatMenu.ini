[ModInfo]
Name = Luvvy Cheat Menu
Description = Luvvy cheat menu for Dishonored GOTY. Uses the retail-safe commands and patches supported by Dishonored Mod Loader.

[Group:player]
Text = Player

[Group:resources]
Text = Resources

[Group:world]
Text = World

[Option:t_infhealth]
Group = player
Text = Immortal
Default = false
OnEnable = patch infhealth
OnDisable = unpatch infhealth

[Option:t_nodeetect]
Group = player
Text = Never detected
Default = false
OnEnable = patch nodeetect
OnDisable = unpatch nodeetect

[Option:t_infmana]
Group = player
Text = Infinite mana
Default = false
OnEnable = patch infmana2
OnDisable = unpatch infmana2

[Option:t_infammo]
Group = resources
Text = Infinite ammo
Default = false
OnEnable = patch infammo
OnDisable = unpatch infammo

[Option:t_infpotions]
Group = resources
Text = Infinite potions
Default = false
OnEnable = patch infpotions
OnDisable = unpatch infpotions

[Option:rune_pick]
Group = resources
Type = action
Text = Give runes
Values = 1,5,25,9999
Labels = +1,+5,+25,+9999
Style = buttons
OnEnable = cheat GiveRunes {v}

[Option:money_pick]
Group = resources
Type = action
Text = Give coins
Values = 50,100,500,9999
Labels = +50,+100,+500,+9999
Style = buttons
OnEnable = cheat GiveMoney {v}

[Option:bonecharm]
Group = resources
Type = action
Text = Give bone charm
OnEnable = cheat GiveBoneCharm

[Option:no_rats]
Group = world
Type = action
Text = Kill rats
OnEnable = cheat KillAllRats

[Option:difficulty]
Group = world
Type = action
Text = Set difficulty
Values = 0,1,2,3
Labels = Easy,Normal,Hard,Very Hard
OnEnable = cheat SetDifficulty {v}

[Option:slomo]
Group = world
Type = action
Text = Time speed
Values = 0.5,1.0,1.5,2.0
Labels = 0.5x,1x,1.5x,2x
OnEnable = cheat DisSlomo {v}

[Option:t_fasttime]
Group = world
Text = Fast time
Default = false
OnEnable = cheat DisSlomo 1.5
OnDisable = cheat DisSlomo 1.0
